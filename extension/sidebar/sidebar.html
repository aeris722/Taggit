<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taggit</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">T</div>
        <div class="header-text">
          <h1>Taggit</h1>
          <p>Save Reddit chats, notes, and follow-ups.</p>
        </div>
        <div class="header-actions">
          <button id="densityToggleBtn" class="icon-btn density-toggle" type="button" aria-label="Toggle compact density" aria-pressed="false" title="Toggle density">↕</button>
          <button id="themeToggleBtn" class="icon-btn theme-toggle" type="button" aria-label="Toggle light theme" aria-pressed="false" title="Toggle theme">☾</button>
        </div>
      </header>

      <section class="card primary-card">
        <div class="section-heading">
          <span class="card-title">Current Conversation</span>
          <span id="formMode" class="subtle-text">Select a chat</span>
        </div>
        <div id="contextPreview" class="context-preview" aria-live="polite">No conversation selected yet.</div>

        <form id="tagForm" class="tag-form">
          <label id="colorPickerLabel">Color</label>
          <div id="colorPicker" role="radiogroup" aria-labelledby="colorPickerLabel"></div>

          <div class="label-row">
            <label for="tagInput">Tag</label>
            <span id="tagCharCount" class="counter">0/28</span>
          </div>
          <div class="row">
            <input id="tagInput" type="text" placeholder="e.g. friend, lead, follow-up" maxlength="28" required />
            <button id="saveBtn" type="submit">Save</button>
          </div>
          <div id="tagSuggestions" class="suggestion-row" aria-label="Quick tag suggestions"></div>

          <div class="label-row">
            <label for="descInput">Note</label>
            <span id="descCharCount" class="counter">0/1600</span>
          </div>
          <textarea id="descInput" placeholder="Why does this conversation matter?" maxlength="1600"></textarea>
          <div id="noteTemplates" class="suggestion-row" aria-label="Note templates">
            <button class="suggestion-chip" type="button" data-template="Follow up: ">Follow up</button>
            <button class="suggestion-chip" type="button" data-template="Context: ">Context</button>
            <button class="suggestion-chip" type="button" data-template="Next step: ">Next step</button>
          </div>

          <div class="form-grid follow-up-grid">
            <div>
              <label for="followUpInput">Follow-up</label>
              <input id="followUpInput" type="date" aria-label="Follow-up date" />
            </div>
            <div>
              <label for="statusSelect">Status</label>
              <select id="statusSelect" aria-label="Conversation status">
                <option value="new">Active</option>
                <option value="follow-up">Follow up</option>
                <option value="waiting">Waiting</option>
                <option value="opportunity">Important</option>
                <option value="closed">Done</option>
              </select>
            </div>
          </div>

          <div class="form-footer">
            <button id="resetFormBtn" class="text-btn" type="button">Reset</button>
            <span id="saveStatus" class="status-text" role="status" aria-live="polite"></span>
          </div>
        </form>
      </section>

      <section class="card saved-card">
        <div class="list-header compact-list-header">
          <div>
            <span class="card-title">Saved Conversations</span>
            <span id="listCount" class="subtle-text"></span>
          </div>
        </div>
        <div class="filter-row primary-search">
          <input id="filterInput" type="search" placeholder="Search tag, username, or note..." aria-label="Search saved conversations" />
          <button id="clearFilterBtn" class="icon-btn" type="button" aria-label="Clear search">×</button>
        </div>
        <ul id="taggedList" class="tagged-list"></ul>

        <details class="secondary-panel list-options-panel">
          <summary>List options</summary>
          <div class="control-grid">
            <label for="sortSelect">Sort</label>
            <select id="sortSelect" aria-label="Sort saved conversations">
              <option value="newest">Newest updated</option>
              <option value="oldest">Oldest updated</option>
              <option value="tag">Tag A-Z</option>
              <option value="username">Username A-Z</option>
            </select>
            <label for="viewSelect">View</label>
            <select id="viewSelect" aria-label="View saved conversations">
              <option value="active">Active</option>
              <option value="all">All</option>
              <option value="pinned">Pinned</option>
              <option value="dueToday">Due today</option>
              <option value="overdue">Overdue</option>
              <option value="waiting">Waiting</option>
              <option value="opportunities">Important</option>
              <option value="noNextStep">No next step</option>
              <option value="recentlyActive">Recently active</option>
              <option value="withNotes">With notes</option>
              <option value="withoutNotes">No notes</option>
              <option value="cooling">Cooling off</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          <div id="tagCloud" class="tag-cloud" aria-label="Saved tag filters"></div>
        </details>

        <details class="secondary-panel data-panel">
          <summary>Data and bulk actions</summary>
          <div class="list-actions">
            <button id="importTagsBtn" class="ghost-btn" type="button">Import</button>
            <button id="exportTagsBtn" class="ghost-btn" type="button">Export</button>
            <button id="exportCsvBtn" class="ghost-btn" type="button">CSV</button>
            <button id="copyMarkdownBtn" class="ghost-btn" type="button">Copy MD</button>
            <button id="clearAllBtn" class="ghost-btn danger-action" type="button">Clear All</button>
          </div>
          <input id="importFileInput" class="visually-hidden" type="file" accept="application/json,.json" />
          <div id="bulkToolbar" class="bulk-toolbar" hidden>
            <span id="selectedCount" class="subtle-text">0 selected</span>
            <button id="selectVisibleBtn" class="ghost-btn" type="button">Select Visible</button>
            <button id="exportSelectedBtn" class="ghost-btn" type="button">Export Selected</button>
            <button id="archiveSelectedBtn" class="ghost-btn" type="button">Archive Selected</button>
            <button id="deleteSelectedBtn" class="ghost-btn danger-action" type="button">Delete Selected</button>
            <button id="clearSelectionBtn" class="ghost-btn" type="button">Clear</button>
          </div>
        </details>
      </section>

      <details class="secondary-panel tools-panel">
        <summary>Optional tools</summary>

        <section class="card command-center" aria-labelledby="commandCenterTitle">
          <div class="section-heading">
            <span id="commandCenterTitle" class="card-title">Follow-up Agenda</span>
            <span id="dailyBrief" class="subtle-text">Loading...</span>
          </div>
          <section class="stats-strip" aria-label="Follow-up counts">
            <button class="stat action-stat" type="button" data-view-shortcut="dueToday">
              <span id="totalStat" class="stat-value">0</span>
              <span class="stat-label">Due Today</span>
            </button>
            <button class="stat action-stat" type="button" data-view-shortcut="overdue">
              <span id="pinnedStat" class="stat-value">0</span>
              <span class="stat-label">Overdue</span>
            </button>
            <button class="stat action-stat" type="button" data-view-shortcut="opportunities">
              <span id="notesStat" class="stat-value">0</span>
              <span class="stat-label">Important</span>
            </button>
            <button class="stat action-stat" type="button" data-view-shortcut="noNextStep">
              <span id="uniqueStat" class="stat-value">0</span>
              <span class="stat-label">No Next Step</span>
            </button>
          </section>
          <div id="dailyActionList" class="daily-action-list" aria-live="polite"></div>
        </section>

        <section class="card ai-card">
          <div class="section-heading">
            <span class="card-title">AI Summary</span>
            <span id="summaryStatus" class="subtle-text" role="status" aria-live="polite"></span>
          </div>
          <label for="apiKeyInput">Gemini API Key</label>
          <input id="apiKeyInput" type="password" placeholder="Paste your Gemini API key" autocomplete="off" />
          <div class="summary-actions">
            <button id="saveApiKeyBtn" class="ghost-btn" type="button">Save Key</button>
            <button id="summarizeBtn" type="button">Summarize</button>
          </div>
          <div class="summary-feedback">
            <button id="useSummaryBtn" class="ghost-btn" type="button" disabled>Use as Note</button>
            <button id="copySummaryBtn" class="ghost-btn" type="button" disabled>Copy</button>
            <button id="goodSummaryBtn" class="ghost-btn" type="button" disabled hidden>Good</button>
            <button id="badSummaryBtn" class="ghost-btn" type="button" disabled hidden>Bad</button>
          </div>
          <div id="summaryOutput" class="summary-output" tabindex="0">No summary yet.</div>
        </section>
      </details>
    </main>
    <script src="../utils/constants.js"></script>
    <script src="../utils/storage.js"></script>
    <script src="../ai/summarize.js"></script>
    <script src="sidebar.js"></script>
  </body>
</html>
