<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reddit Tags</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <main class="container">

      <header class="header">
        
        <div class="header-text">
          <h1>Reddit Tags</h1>
          <p>Tag and organize your Reddit conversations.</p>
        </div>
      </header>

      <section class="card">
        <span class="card-title">Add Tag</span>
        <div id="contextPreview" class="context-preview">No conversation selected yet.</div>

        <form id="tagForm" class="tag-form">
          <label>Color</label>
          <div id="colorPicker"></div>

          <label for="tagInput">Tag Label</label>
          <div class="row">
            <input id="tagInput" type="text" placeholder="e.g. friend, work, follow-up" required />
            <button type="submit">Save</button>
          </div>

          <label for="descInput">Description</label>
          <textarea id="descInput" placeholder="Add notes about this person..."></textarea>
        </form>
      </section>

      <section class="card">
        <div class="list-header">
          <span class="card-title">Tagged Conversations</span>
          <button id="clearAllBtn" class="ghost-btn" type="button">Clear All</button>
        </div>
        <input id="filterInput" type="text" placeholder="Filter by tag or username..." />
        <ul id="taggedList" class="tagged-list"></ul>
      </section>

    </main>
    <script src="sidebar.js"></script>
  </body>
</html>
